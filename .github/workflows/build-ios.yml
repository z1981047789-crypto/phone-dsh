      - name: Build DeepSeek Harness
        run: |
          set -euo pipefail

          DSH_DIR="$RUNNER_TEMP/deepseek-harness"
          DSH_COMMIT="7be5505b0be06009d74891c869063c9cf19a0df0"

          echo "Initializing DeepSeek Harness..."

          mkdir -p "$DSH_DIR"

          git -C "$DSH_DIR" init

          git -C "$DSH_DIR" remote add origin \
            https://github.com/deepseek-ai/deepseek-harness.git

          echo "Fetching pinned commit..."

          git -C "$DSH_DIR" fetch \
            --no-tags \
            --depth=1 \
            origin "$DSH_COMMIT"

          echo "Checking out pinned commit..."

          git -C "$DSH_DIR" checkout --detach FETCH_HEAD

          echo "Verifying commit..."

          ACTUAL_COMMIT=$(git -C "$DSH_DIR" rev-parse HEAD)

          if [ "$ACTUAL_COMMIT" != "$DSH_COMMIT" ]; then
            echo "ERROR: Commit mismatch"
            exit 1
          fi

          git -C "$DSH_DIR" cat-file -e 'HEAD^{tree}'

          echo "DeepSeek Harness checkout verified."

          cd "$DSH_DIR"

          pnpm install --frozen-lockfile

          pnpm build

          echo "PDSH_DSH_CHECKOUT=$DSH_DIR" >> "$GITHUB_ENV"
